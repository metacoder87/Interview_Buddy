- id: Q1
  question: Tell me about yourself
  triggers:
    - tell me about yourself
    - share your background
  answer: |
    Applied AI engineer and quantitative developer with six-plus years of full-stack experience, focused on local-first AI systems — RAG applications, multi-agent orchestration over open-weight models, and vector search infrastructure. I run my own shop, G M Cubed Designs; recent flagships are Sidekick LLM, a desktop knowledge system for local LLMs, SYNAPSE, a job‑intelligence platform that ranks semantic fit and produces fact‑checked company dossiers with a local agent crew, and Investment Matrix, an event‑driven crypto research and paper‑trading platform with a seven-agent local AI research team. Before that I was an Aviation Structural Mechanic in the US Navy — three years of zero‑fail diagnostics under pressure, which is still how I approach debugging.
