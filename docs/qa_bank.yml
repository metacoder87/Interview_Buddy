  answer: 'I look at the ''Bottleneck Analysis.'' If the model is slow, we explore: (1) Quantization (e.g.,
    4-bit instead of 8-bit), (2) Speculative Decoding (using a tiny model to guess and a big model to
    verify), or (3) Model Distillation—training a small model to mimic the behavior of a large one on
    our specific tasks.'
