entries:
- id: Q1
  question: Tell me about yourself
  triggers:
  - tell me about yourself
  - share your background
  - why dont you tell me about yourself
  - walk me through your background
  answer: Applied AI engineer and quantitative developer with over 7 years of full-stack experience, focused
    on high-reliability, local-first AI systems. My expertise covers RAG infrastructure, multi-agent orchestration
    over open-weight models, and data-intensive systems for quantitative finance. I run my own engineering
    shop, G M Cubed Designs; our flagships include Sidekick LLM, a privacy-first knowledge vault; SYNAPSE,
    a job-intelligence platform featuring a deterministic multi-agent crew; and Investment Matrix, an
    event-driven crypto research and paper-trading platform. My technical foundation was built in the
    US Navy as an Aviation Structural Mechanic, where I learned to manage zero-fail diagnostics under
    extreme pressure — a discipline I now apply to building production-grade software.
  gotcha_warning: ''
- id: Q2
  question: Why are you interested in this role?
  triggers:
  - why are you interested in this role
  - what motivates you for this position
  - why do you want this job
  - why are you interviewing with us today
  answer: 'Three primary reasons. First, this role sits at the exact intersection of my core expertise:
    building AI systems that are reliable enough to drive real-world decisions. My work on RAG evaluation
    and deterministic guardrails maps directly to your needs. Second, I do my best work when there is
    a clear quality bar; I am looking for a product where I can contribute to measurable ROI and technical
    excellence. Third, I ship complete systems solo at full-stack speed — from requirements and architecture
    to observability — meaning I can be productive and contributing to the roadmap from day one.'
  gotcha_warning: ''
- id: Q3
  question: Walk me through Sidekick LLM
  triggers:
  - walk me through sidekick llm
  - explain sidekick llm
  - tell me about sidekick llm
  answer: 'Sidekick LLM is a privacy-first desktop knowledge system for local LLMs via Ollama. The core
    architectural decision is that the product isn''t the chat window, it''s the corpus — a persistent,
    de-duplicated memory of personal facts and domain "Expert vaults." Engineering highlights I''m proud
    of include: a federated expert consultation system where one query searches multiple independent vaults,
    with a prompt architecture that explicitly asks the model to surface disagreements rather than flattening
    them; and an embedding contract treated as a load-bearing invariant, where every vector carries its
    embedding model and dimension, preventing silent retrieval degradation. It''s an Electron + React
    + SQLite system that operates 100% offline.'
  gotcha_warning: ''
- id: Q4
  question: What was the hardest technical problem in Sidekick LLM?
  triggers:
  - what was the hardest technical problem in sidekick llm
  - hardest technical problem sidekick llm
  - toughest issue sidekick llm
  answer: 'Silent retrieval degradation. Vector search will happily return confidently wrong results when
    embeddings drift or a model swap changes dimensions. To solve this, I made correctness an invariant:
    every stored vector carries its embedding model and dimension, the write boundary rejects empty vectors,
    and retrieval logic excludes and reports mismatched vectors rather than scoring them zero, preventing
    silent accuracy degradation. The broader lesson is that probabilistic components (like LLMs) require
    deterministic guardrails around their inputs and outputs, and honest failure reporting is always superior
    to blanket success.'
  gotcha_warning: ''
- id: Q5
  question: Walk me through SYNAPSE
  triggers:
  - walk me through synapse
  - explain synapse
  - tell me about synapse
  answer: 'SYNAPSE is a local-first job-intelligence platform. It normalizes six disparate data sources
    into a unified Pydantic model, using a deterministic regex kill switch to discard non-matches before
    they hit the embedding engine. It features a CrewAI-powered research crew on local Ollama that produces
    fact-checked dossiers where claims carry evidence references and numeric literals are validated by
    deterministic code. Freshness is enforced through a triple-layer system: daily expiry on dates, 12-hour
    heartbeat probing of live URLs, and a weekly purge across both Postgres and ChromaDB stores. My backend
    achieved 76/32 passed tests with a green production build.'
  gotcha_warning: ''
- id: Q6
  question: How do you keep an LLM from hallucinating in a system like SYNAPSE?
  triggers:
  - how do you keep an llm from hallucinating in a system like synapse
  - how to keep llm from hallucinating synapse
  - prevent llm hallucination synapse
  - prevent lla m hallucination
  answer: 'I use a four-layer "Defense-in-Depth" strategy. One, constrain the model''s operational scope
    — it generates structured claims in a stage rather than the whole document. Two, make those claims
    checkable: every claim carries evidence references and numeric literals are validated by deterministic
    code, not another model call. Three, use a verifier with a restricted output space (supported, contradicted,
    or insufficient) at temperature zero. Four, keep final rendering deterministic — Python assembles
    the final cited dossier from approved claims only. I apply this same "probabilistic components/deterministic
    boundaries" rule across all my AI work.'
  gotcha_warning: ''
- id: Q7
  question: Walk me through Investment Matrix
  triggers:
  - walk me through investment matrix
  - tell me about investment matrix
  - explain investment matrix
  answer: 'It''s a self-hosted crypto research and paper-trading platform where nothing leaves the machine.
    We use a high-throughput ingestion pipeline: parallel WebSocket streamers push ticks into Redis Streams
    with backpressure isolation, pending-message recovery, and a dead-letter queue (DLQ) to ensure zero
    tick loss during consumer restarts. The key architectural rule is that the LLM is off the trade path;
    a deterministic formula engine makes entry decisions, validated by three independent checks: a 7-day
    backtest, a thesis-geometry simulation of the exact TP/SL, and a risk guardrail stack with fractional-Kelly
    sizing from realized win rates. Alongside trading, a 7-agent research organization on isolated Celery
    queues maintains a versioned Strategy Playbook with champion/challenger shadow evaluation to ensure
    only validated strategies reach production.'
  gotcha_warning: ''
- id: Q8
  question: What was the hardest problem in Investment Matrix?
  triggers:
  - what was the hardest problem in investment matrix
  - hardest problem investment matrix
  answer: 'Backpressure between ingestion and storage at tick rates. In high-frequency systems, a slow
    writer can''t just buffer indefinitely or we face OOM; we need a durable isolation layer. I implemented
    Redis Streams as the buffer — streamers write and move on, while consumers track pending messages
    with recovery plus a dead-letter queue for poison entries. This ensures we don''t drop ticks while
    maintaining a consistent write path to TimescaleDB hypertables. The lesson: in event-driven systems,
    define your consistency boundaries explicitly — exactly-once where it matters, at-least-once where
    it doesn''t.'
  gotcha_warning: ''
- id: Q9
  question: Tell me about StockMaster
  triggers:
  - tell me about stockmaster
  - walk me through stockmaster
  answer: StockMaster is the equities side of my quantitative work. It follows the same philosophy as
    Investment Matrix — deterministic decision engine, models in advisory roles, and risk-reviewed execution
    — but targets stock markets. It's a high-performance Python-based system that handles real-time market
    ingestion, quantitative backtesting, and autonomous trading crews. Investment Matrix is the more advanced
    of the two, so I'd point a panel there for a deeper dive into the architecture.
  gotcha_warning: ''
- id: Q10
  question: Walk me through PyHoldem Pro
  triggers:
  - walk me through pyholdem pro
  - tell me about pyholdem pro
  answer: A quantitative poker training platform providing real-time EV-based coaching. I'm particularly
    proud of solving the CPU-bound Monte Carlo simulation problem. Running thousands of deals per query
    was blocking the FastAPI event loop and freezing the UI. I built a compressed lookup table with a
    fast hand-evaluation module, cached identical board/hand combinations, and switched to exact enumeration
    for low cards-to-come. This took our computation from seconds to single-digit milliseconds, ensuring
    the UI remains fluid during high-intensity training.
  gotcha_warning: ''
- id: Q11
  question: Walk me through the Qdrant Search Console
  triggers:
  - walk me through the qdrant search console
  - tell me about qdrant search console
  answer: A document-first semantic search system over PDFs, HTML, and text. The core engineering contribution
    here was "hit aggregation" — raw vector results often return scattered chunks from the same document,
    drowning the user in noise. I built an algorithm to group chunk hits by `doc_id` and average the similarity
    score, ensuring the results are sorted by document relevance. I also implemented a deterministic CI-seeding
    utility to ensure our test states are reproducible across every push.
  gotcha_warning: ''
- id: Q12
  question: Walk me through Learning Tree
  triggers:
  - walk me through learning tree
  - tell me about learning tree
  answer: 'A local-first K-12 family-learning app built around an explorable 3D tree. The design stance
    is "evidence-based mastery": we don''t reward repetition. Mastery is a six-level state machine where
    each level requires specific artifacts (instruction + assessment) and scheduled reviews, all while
    keeping family data strictly local and secure. I implemented an "Evidence-based state machine" where
    open-ended responses are flagged for parent review rather than being graded by an unmonitored model.
    The curriculum itself is a versioned contract with Ed25519 release signing, ensuring content is immutable
    and verified.'
  gotcha_warning: ''
- id: Q13
  question: Walk me through Coder Core
  triggers:
  - walk me through coder core
  - tell me about coder core
  answer: A local-first desktop mastery system for CS learning and workforce-readiness. It features 48
    prerequisite-linked skills, 48 cited lessons, and 144 drills, all verified in Docker. The standout
    feature is the Assessment Simulator, which supports online-assessment, interviewer-led, and paired-coding
    modes. It uses a hardened Docker sandbox (no network, read-only root, CPU/RAM limits) to ensure the
    execution environment is isolated and reproducible. It also features "honest mastery" estimates, where
    drill-only readiness is capped at 35% to prevent users from faking assessment performance.
  gotcha_warning: ''
- id: Q14
  question: Tell me about a time you solved a difficult technical problem
  triggers:
  - tell me about a time you solved a difficult technical problem
  - solved a difficult technical problem
  answer: 'S: In PyHoldem Pro, range-versus-range equity needed thousands of Monte Carlo card deals per
    query, and running them synchronously inside the FastAPI event loop was freezing WebSocket connections
    — live tables would stall mid-hand.

    T: I owned the simulation engine performance; the constraint was keeping p95 under a few milliseconds
    without changing game rules.

    A: I built a compressed lookup table plus a fast hand-evaluation module, cached identical board/hand
    combinations, and switched to exact enumeration whenever cards-to-come were low enough that it beat
    Monte Carlo.

    R: Equity computation went from seconds to single-digit milliseconds, the event loop stayed responsive
    under concurrent tables, and the whole engine is covered by 630+ tests so the math can''t silently
    regress.'
  gotcha_warning: ''
- id: Q15
  question: Tell me about a time something failed or you found a bug in production-shaped code
  triggers:
  - tell me about a time something failed or you found a bug in production shaped code
  - something failed or you found a bug in production
  - something failed or you found
  answer: 'S: In SYNAPSE, job records live in two stores — PostgreSQL for truth, ChromaDB for vectors,
    keyed by shared UUIDs. A permanent-delete path was removing the Postgres row but not always the vector,
    so deleted jobs could resurface in semantic search.

    T: I owned data consistency across both stores; it had to be fixed without a manual cleanup script
    users would have to run.

    A: I introduced tombstones for deletions plus a vector-cleanup retry record — the delete is durable
    first, vector removal retries until confirmed, and the weekly freshness purge reconciles anything
    still stale in both stores together.

    R: The two stores can no longer drift on deletes, and the reconciliation pass made the failure mode
    self-healing instead of something I''d discover from a user report.'
  gotcha_warning: ''
- id: Q16
  question: Tell me about a time you disagreed with a technical approach
  triggers:
  - tell me about a time you disagreed with a technical approach
  - disagreed with a technical approach
  answer: 'S: While building SYNAPSE''s dossier generation, the natural path — and what my AI coding tools
    kept suggesting — was to have the LLM write the final document end-to-end. It looked better in demos.

    T: I owned the architecture decision for how dossiers get rendered.

    A: I pushed for claim-gated generation instead: the model proposes structured claims with evidence
    references, deterministic code checks numeric literals, a temperature-zero verifier returns supported/contradicted/insufficient,
    and Python renders the final cited document from approved claims only. It''s more moving parts up
    front.

    R: Dossiers became inspectable — every sentence traces to evidence or is marked insufficient — and
    the model stayed replaceable. When I explain this in interviews I frame it as my general rule: probabilistic
    components where they help, deterministic boundaries where trust matters.'
  gotcha_warning: ''
- id: Q17
  question: Tell me about a time you worked under pressure
  triggers:
  - tell me about a time you worked under pressure
  - worked under pressure
  answer: 'S: In the Navy as an Aviation Structural Mechanic, I did precision maintenance and diagnostic
    inspection on jet aircraft — hydraulic, structural, landing-gear systems — where the failure budget
    was zero and the schedule didn''t care about your confidence level.

    T: My job was root-cause diagnosis and documentation that the next crew could trust without me in
    the room.

    A: I built a habit of writing the diagnostic path down as I went — symptom, hypothesis, test, result
    — so the work survived handoff. That''s literally how I structure debugging now: hypotheses logged,
    evidence attached, no silent fixes.

    R: It transferred directly to software: my projects ship with the same discipline — 630+ tests in
    PyHoldem Pro, deterministic CI seeding in Qdrant Search, explicit release gates in Learning Tree.
    Pressure handling for me is a documentation and verification habit, not a personality trait.'
  gotcha_warning: ''
- id: Q18
  question: What's your biggest professional mistake?
  triggers:
  - what's your biggest professional mistake
  - whats your biggest professional mistake
  - biggest professional mistake
  answer: 'I let a status claim outrun its evidence. In SYNAPSE I was describing the project as having
    "green CI" when the GitHub Actions push trigger still pointed at `main` while the repo branch was
    `master` — so "CI is green" wasn''t actually verified for pushes. I caught it during an honest status
    audit and wrote it into my own interview playbook as a language boundary: don''t claim what you haven''t
    watched happen, with a date. The fix was mechanical — correct the trigger, run a dated verification
    — but the lesson shaped how I present everything since: "working local system" instead of "production
    platform," confidence levels on mastery estimates in Coder Core, honest status snapshots in Learning
    Tree.'
  gotcha_warning: ''
- id: Q19
  question: How do you design a RAG system?
  triggers:
  - how do you design a rag system
  - design a rag system
  - how do you design a rag
  answer: 'I''d walk it as five decisions. One, chunking strategy matched to the content — for my project
    docs I split on section headers first because that''s where the evidence lives, then size-cap at paragraph
    boundaries with overlap. Two, embedding model chosen by measured latency and quality on your actual
    query distribution, not benchmarks — I run nomic-embed-text locally when privacy or cost matters.
    Three, retrieval architecture: dense vectors for semantics, but aggregate to the right unit of meaning
    — in Qdrant Search that was chunk hits averaged up to document level so big documents don''t dominate
    results. Four, grounding discipline: retrieved context gets cited, and generation is constrained to
    what''s retrievable — my overlay literally marks each bullet as grounded-in-your-docs versus general
    knowledge. Five, evaluation before you trust it: golden question sets with measured retrieval hit-rate,
    like the ten-point deterministic seed dataset I use for CI in Qdrant Search.'
  gotcha_warning: ''
- id: Q20
  question: How do you evaluate generative models?
  triggers:
  - how do you evaluate generative models
  - evaluate generative models
  answer: 'Three layers from my actual workflow. One, rubric-based evals — when I evaluated Codex and
    Claude for code generation and deterministic JSON output, I wrote explicit rubrics per capability
    so "better" was a score, not a vibe. Two, constrained-output testing — if the model must emit JSON
    or structured claims, test that contract hard: schema validation, retry behavior, and what happens
    on invalid output; in Investment Matrix the LLM runs under a JSON contract with prompt retries and
    agent validation. Three, golden sets with deterministic checks where possible — SYNAPSE''s dossier
    pipeline checks numeric literals by code and uses a temperature-zero verifier with a three-way verdict
    space, so evaluation is reproducible run to run. And I track it over time: per-strategy scorecards
    in Investment Matrix feed position sizing, which means the eval loop actually changes behavior, not
    just a dashboard.'
  gotcha_warning: ''
- id: Q21
  question: Local LLMs versus cloud APIs — how do you decide?
  triggers:
  - local llms versus cloud apis how do you decide
  - local llms versus cloud apis
  - local llms versus cloud apis how
  answer: 'I default local when any of these are true: the data is sensitive — my trading strategies and
    job-search history never leave the machine; latency has to be predictable — a warm local model on
    my RTX 5080 gives me first tokens in one to three seconds with no network variance; or cost compounds
    — Investment Matrix''s nightly analyst and SYNAPSE''s dossier crew run constantly, so zero per-token
    pricing matters. Cloud wins when I need the strongest reasoning for a one-off hard problem, or when
    the team is smaller than my context window — which is why everything I build keeps an escape hatch:
    Ollama as the default provider with the same JSON contracts a cloud API would use, so switching is
    a config change. The anti-pattern I avoid is local-by-default-everywhere: for interactive chat on
    weak hardware, a small fast model locally beats a big slow one, and that''s a measured decision —
    I benchmark TTFT and tokens-per-second on the actual machine before choosing.'
  gotcha_warning: ''
- id: Q22
  question: When would you use multi-agent systems? And when wouldn't you?
  triggers:
  - when would you use multi agent systems and when wouldn't you
  - when would you use multi agent systems and when wouldnt you
  - when to use multi agent systems
  - when would you use multi agent
  answer: 'I''d use them when the work decomposes into roles with different information needs or different
    trust levels — Investment Matrix''s research team is the example: Scout selects coins, Deep Research
    builds dossiers, Backtest Lab sweeps parameters on historic data, Strategy Scientist converts validated
    findings into a versioned playbook, and a Risk Officer sits between research and live trading. Two
    rules I enforce from that build: agents get isolated queues so research can never delay trading, and
    autonomy is tiered — playbook promotions are manual at tier zero, automatic only at tier one after
    out-of-sample gates pass. I wouldn''t use them when a single prompt with good structure does the job
    — extra agents multiply your failure surface and your eval burden. SYNAPSE''s crew is deliberately
    three agents, not ten: Scout, Networker, Fact-Checker, because those are the three distinct information
    roles the dossier actually needs.'
  gotcha_warning: ''
- id: Q23
  question: How do you choose a vector database?
  triggers:
  - how do you choose a vector database
  - choose a vector database
  - how do you choose a vector
  answer: 'For my scale — thousands of chunks, single user or small team — I''d be honest that the differentiator
    is operational, not raw ANN performance: persistence model, filtering quality, and consistency story
    with your relational store. That''s why Qdrant in Docker with disk-persistent volumes won for both
    Qdrant Search and SYNAPSE — same UUIDs across Postgres and ChromaDB or Qdrant, deterministic seeding
    utilities for CI, and a clear path to hybrid search when I need it. The consistency lesson from running
    dual stores: define the source of truth explicitly (Postgres), key vectors by the same IDs, make deletes
    tombstone-plus-retry rather than assume atomicity across systems, and add a reconciliation pass. At
    larger scale I''d evaluate on filtered-search latency with my real query mix, replication story, and
    what happens to embeddings when dimensions change — which is why Sidekick LLM stores embedding provenance
    per vector.'
  gotcha_warning: ''
- id: Q24
  question: Design a system to match job candidates to postings at scale
  triggers:
  - design a system to match job candidates to postings at scale
  - match job candidates to postings at scale
  - design a system to match job
  answer: 'I''ve built exactly this as SYNAPSE, so I''d design it from that experience. Ingestion: adapter
    pattern per source normalizing into one schema — because every provider''s payload is different and
    you don''t want that mess leaking into ranking. Screening before spend: a deterministic rule gate
    kills obvious mismatches cheaply; embeddings are the expensive step so they run on survivors only.
    Ranking: semantic similarity against the candidate profile, blended with role-lane, skill, seniority,
    freshness, and source-quality signals — pure cosine ranking over-weights vocabulary match. Freshness
    is a first-class subsystem: daily expiry on dates, 12-hour heartbeat probing of live URLs, and a periodic
    purge across stores. Then the human-in-the-loop layer: lifecycle tracking, reversible dismissals,
    structured feedback that can retrain or rescore later, and on-demand deep research — in my case an
    agent crew producing fact-checked dossiers with claim-level verification. I''d add for scale: idempotent
    ingestion keyed by posting identity, a scoring service decoupled from the API tier so rescoring is
    a batch job, and evals — useful-job rate and stale-posting rate as the metrics that tell you ranking
    actually improved.'
  gotcha_warning: ''
- id: Q25
  question: Design a real-time market data pipeline
  triggers:
  - design a real time market data pipeline
  - real time market data pipeline
  - design a real time market data
  answer: 'From Investment Matrix. Ingestion: one WebSocket streamer per exchange pushing standardized
    ticks into Redis Streams with backpressure isolation, pending-message recovery, and a dead-letter
    queue (DLQ) to ensure zero tick loss during consumer restarts. Storage: TimescaleDB hypertables for
    high-velocity tick storage; hot reads go through Redis first for sub-second latency. Decisioning:
    the key rule is that the LLM is off the trade path — a deterministic formula engine makes entry decisions,
    validated by three independent checks: a 7-day backtest, a thesis-geometry simulation of the exact
    TP/SL, and a risk guardrail stack with fractional-Kelly sizing from realized win rates. Learning loop:
    every prediction scored against realized prices feeds per-strategy scorecards that resize positions
    automatically. Observability is non-negotiable at this layer — writer throughput and lag sparklines,
    stream depths, queue depths on a live ops page, because in event-driven systems the first symptom
    of failure is a depth graph going vertical.'
  gotcha_warning: ''
- id: Q26
  question: Why should we hire you?
  triggers:
  - why should we hire you
  - why would we hire you
  answer: 'Three things I''d point to. One, I ship complete systems solo at full-stack speed — requirements,
    architecture, implementation, tests, observability — so the gap between "interview candidate" and
    "productive in week one" is small; every project on my portfolio has that shape, from 630-test poker
    engines to seven-agent trading research teams. Two, I have a philosophy for applied AI that panels
    are increasingly hiring for: probabilistic components where they help, deterministic boundaries where
    trust matters — claim-gated generation, verifiers with restricted output spaces, evals with real scorecards
    feeding behavior. Three, I measure before I claim: confidence levels on mastery estimates, grounded-versus-general
    markers on every answer, honest status snapshots. You get someone who will tell you what''s verified
    and what isn''t — which is the cheapest insurance in an engineering org.'
  gotcha_warning: ''
- id: Q27
  question: How do you balance "Recall" vs. "Precision" in a RAG system?
  triggers:
  - how do you balance recall vs precision in a rag system
  - how do you balance recall vs
  answer: It’s a sliding scale. High recall gives the model more 'options' but increases the risk of noise
    and 'lost in the middle' issues. High precision ensures the model only sees what it needs, but risks
    missing the answer entirely. My approach is to optimize for **Precision-First** in high-stakes environments
    (like SYNAPSE) by using a re-ranking step. If the user needs a broader 'brainstorming' session, I
    can dial down the filtering and increase the recall by expanding the chunk size or the number of retrieved
    hits.
  gotcha_warning: ''
- id: Q28
  question: Talk to me about "Idempotency" and "Data Integrity" in your ingestion pipelines
  triggers:
  - talk to me about idempotency and data integrity in your ingestion pipelines
  - talk to me about idempotency and
  answer: In quantitative and high-reliability systems, idempotency is non-negotiable. You can't have
    a situation where a network glitch causes a trade or a data point to be recorded twice. In my Investment
    Matrix project, I ensured this by using unique transaction IDs and 'upsert' logic in the database.
    If a process fails halfway through, it can restart and reach the exact same state without duplicating
    side effects. I treat every ingestion as a series of atomic, idempotent operations.
  gotcha_warning: ''
- id: Q29
  question: How do you handle "Cold Starts" and "Model Loading" in a local-first LLM application?
  triggers:
  - how do you handle cold starts and model loading in a local first llm application
  - how do you handle cold starts
  answer: 'This is a major UX hurdle for local AI; users don''t want to wait 30 seconds for a model to
    load into VRAM every time they open an app. My strategy is a multi-layered approach: 1. Persistent
    background loading (keeping the model warm in VRAM). 2. Efficient memory management (offloading inactive
    layers). 3. User-facing progress indicators that provide ''actionable'' wait times. In Sidekick LLM,
    the goal is to make the AI feel like a native part of the OS—always ready, never ''booting''.'
  gotcha_warning: ''
- id: Q30
  question: Tell me about a time you made a difficult technical trade-off under a tight deadline
  triggers:
  - tell me about a time you made a difficult technical trade off under a tight deadline
  - made a difficult technical trade
  answer: During the initial build of the Investment Matrix, we had to decide between a fully-automated
    'Auto-Trade' engine and a 'Semi-Automated' one. The 'Auto' version would have been faster to market
    but carried a significantly higher risk of 'flash crash' losses due to unforeseen edge cases in the
    data. I made the call to stick with the 'Semi-Automated' path—where the AI generates the thesis and
    the human gives the final 'green light.' It was a trade-off in speed for safety, and I communicated
    that clearly to the stakeholders as a risk-mitigation strategy.
  gotcha_warning: ''
- id: Q31
  question: When would you choose Fine-Tuning over RAG?
  triggers:
  - when would you choose fine tuning over rag
  answer: It depends on the goal. RAG is my default for knowledge retrieval because it provides grounded
    evidence, easy updates, and transparency. I only move to fine-tuning when I need to change the *behavior*
    or *style* of the model — like teaching it a specific dialect of internal jargon or a very specific
    output format that prompting can't consistently hit. In my work, RAG provides the 'facts,' and the
    model provides the 'reasoning.' Mixing them is often a waste of compute.
  gotcha_warning: ''
- id: Q32
  question: How do you handle the 'Lost in the Middle' problem with long context windows?
  triggers:
  - how do you handle the 'lost in the middle' problem with long context windows
  answer: Context windows are not infinite memory; they are priority queues. I handle this by using "Relevance
    Ranking." After retrieving 20+ chunks, I use a smaller, faster model to re-rank them based on semantic
    similarity to the query. I only feed the top 5-7 most relevant chunks into the prompt. This ensures
    the model focuses on the highest-signal information while staying within the high-attention 'sweet
    spot' of the window.
  gotcha_warning: ''
- id: Q33
  question: How do you manage costs and latency in a production-scale LLM app?
  triggers:
  - how do you manage costs and latency in a production scale llm app
  answer: I look at the "Cost-per-Query" vs. "Value-per-Query." For routine tasks like summarization,
    I use smaller, faster models (like Llama 3.1 8B or Phi-3). For complex reasoning, I move up the chain.
    I also use "Prompt Caching" for static instructions and "Semantic Caching" — if a user asks a question
    we've answered in the last hour, we serve it from the cache instead of re-running the full RAG pipeline.
  gotcha_warning: ''
- id: Q34
  question: How do you handle contradictory evidence in a RAG system?
  triggers:
  - how do you handle contradictory evidence in a rag system
  answer: 'I don''t want the model to ''average'' them; I want it to acknowledge them. In my prompt architecture
    for SYNAPSE, I explicitly instruct the model to surface disagreements where they occur. If Chunk A
    says ''X'' and Chunk B says ''Y'', the response should be: ''There is conflicting information in the
    records. Source A suggests X, while Source B suggests Y.'' This builds trust with the user by being
    honest about the data''s state rather than hallucinating a middle ground.'
