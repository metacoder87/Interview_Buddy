  - how do you handle hallucination in
  answer: 'We use ''Verifiable Citations.'' The model is instructed that every claim must be mapped to
    a source ID. If the model can''t find a source, it must say ''I don''t know.'' We also use a ''NLI''
    (Natural Language Inference) check: does the retrieved chunk *actually* support the claim the model
    just made? If not, the response is flagged for review.'
