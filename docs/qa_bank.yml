- id: Q2
  question: Why are you interested in this role?
  triggers:
    - why are you interested in this role
    - what motivates you for this position
  answer: |
    Three reasons. One, the role sits exactly at the intersection I've been building toward: applied AI systems that have to be reliable enough for real decisions — my work on RAG evaluation and deterministic guardrails around LLMs maps directly onto that. Two, I do my best work when the system has a measurable quality bar; your [product/domain] gives me something concrete to optimize against. Three, I've spent years shipping solo at full‑stack speed — requirements through observability — so I can be productive in week one without a long ramp.
